# Builds the model-environment images of containers/ on demand. Never runs on push: the builds
# take long, need a large runner disk and are not part of the test suite. Start it from the
# Actions tab (workflow_dispatch); with push=true the images go to GHCR under the repository owner.
name: Containers

on:
  workflow_dispatch:
    inputs:
      images:
        description: "Images to build (comma-separated subset of interpretfm,geneformer,c2s)"
        default: "interpretfm,geneformer,c2s"
        type: string
      push:
        description: "Push the images to ghcr.io/<owner>/interpretfm-<name>"
        default: false
        type: boolean
      tag:
        description: "Image tag"
        default: "dev"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [interpretfm, geneformer, c2s]
    steps:
      - name: Skip images not requested
        id: want
        run: |
          if [[ ",${{ inputs.images }}," == *",${{ matrix.image }},"* ]]; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "build=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.want.outputs.build == 'true'
      - name: Free disk space (the CUDA base image and the conda environments are large)
        if: steps.want.outputs.build == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /
      - uses: docker/setup-buildx-action@v3
        if: steps.want.outputs.build == 'true'
      - name: Log in to GHCR
        if: steps.want.outputs.build == 'true' && inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push)
        if: steps.want.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile.${{ matrix.image }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: ghcr.io/${{ github.repository_owner }}/interpretfm-${{ matrix.image }}:${{ inputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Smoke test the image
        if: steps.want.outputs.build == 'true' && !inputs.push
        run: docker run --rm ghcr.io/${{ github.repository_owner }}/interpretfm-${{ matrix.image }}:${{ inputs.tag }} python -m interpretfm.cli version
