# Manuscript configuration: CosMx lung-cancer section, C2S-Scale, stored layer `layer_13`
# (display "Layer 14"). Every parameter is the one used for the manuscript (Methods and
# Supplementary Table S1); the run starts from the cached activation store and the cached
# SAE checkpoint, so no model and no GPU are needed. See configs/paper/cosmx_scgpt_layer2.yaml
# for the commented reference configuration and docs/reproducing.md for the data layout.
#   interpretfm run configs/paper/cosmx_c2s_layer14.yaml --env-file configs/paper/paths.env

run:
  name: cosmx_c2s_layer14
  out_dir: ${INTERPRETFM_RUNS}/cosmx_c2s_layer14
  seed: 0

dataset:
  h5ad: ${INTERPRETFM_DATA}/cosmx_human_lung_sec8.h5ad   # 81,236 cells x 960 genes, X = raw counts
  counts_layer: null
  gene_id: {column: index, kind: ensembl}                 # var_names are Ensembl ids; symbols in var["feature_name"]
  labels: {column: author_cell_type, groups: cosmx_author_groups.csv}   # author types -> the manuscript's 16 interface groups
  spatial: {obsm: spatial, um_per_unit: 0.18}             # CosMx pixel coordinates, 0.18 um per pixel
  qc: {min_transcripts: 0, min_genes: 0}                  # no cell filtering in the manuscript

model:
  name: c2s_scale
  checkpoint: null                                              # weights are not needed: the store is cached
  env: {}                                                 # not used: the activation store is cached
  layers: [layer_13]
  cell_pooling: {kind: mean}             # mean over the cell's gene tokens (no cell-level token)
  special_tokens: []                      # stored token ids are gene symbols, so no vocabulary is needed
  representative_layer: layer_13

stages:
  # Cached activation store written by the manuscript's extraction (60 shards).
  extract: {store_root: "${INTERPRETFM_STORES}/acts_extraction_c2s_cosmx_store"}

  tis: {trials: 800, k_ref: 32, quantiles: [0.25, 0.75], judge: log1p_cp10k,
        controls: [shuffle, pca], pca_of: activations, seed: 42, keep_cell_matrix: true}

  # 8x width (18432 features); lambda = 1 by the fixed rule over {0.1, 0.3, 1, 3, 10} (only the selected
  # checkpoint is cached; the reproduction test applies the rule to the cached QC of all five).
  sae:
    width_multiplier: 8
    lambda: {grid: [1.0], rule: {l0_max: 0.02, dead_max: 0.25}}
    steps: 8000
    lr: 1.0e-4
    warmup: 1000
    resample_every: 2000
    batch_size: 1024
    seed: 0
    device: cpu
    exclude_special_tokens: false
    untrained_baseline: true
    qc: {max_shards: 300, rows_per_shard: 512}
    checkpoints:
      layer_13:
        "1.0": ${INTERPRETFM_PAPER_CACHE}/sae_v2/cosmx/c2sscale/layer_13/sae/v2biased__steps_8000__lam_1/sae_layer_13_best.pt

  # The g:Profiler universe of the panel used for the manuscript (5,650 concepts), from the cache.
  concepts:
    sources: [GO:BP, GO:MF, GO:CC, REAC, KEGG]
    fdr: 0.05
    min_overlap: 2
    organism: hsapiens
    query_key: ensembl
    gene_keys: {symbol_column: feature_name}
    offline_matrix: ${INTERPRETFM_PAPER_CACHE}/f1heldout_gene_token_row_cosmx_all_layers_l1_1e-3/gprofiler/gprofiler_binary_gene_by_term.csv
    offline_terms: ${INTERPRETFM_PAPER_CACHE}/f1heldout_gene_token_row_cosmx_all_layers_l1_1e-3/gprofiler/gprofiler_terms.tsv

  concept_eval:
    thresholds: [0.0, 0.15, 0.3, 0.6]
    split: {valid: 0.2, test: 0.1}
    units: [row, gene]
    representations: [sae, raw, untrained]
    summary: {tau: 0.15, concept_size: [5, 100]}
    dedup_cells: auto
    seed: 0
    top_m: 200
    batch_size: 8192
    device: cpu
    n_jobs: 6              # the six evaluations in separate processes (wall time only; not part of the stage hash)

  gene_readout:
    n_splits: 5
    C: 1.0
    scaling: [standardize, center]
    controls: [random, coexpression, coexpression_pc50, celltype, trivial]
    concept_size: [5, 100]
    split: {valid: 0.2, test: 0.1}
    max_cells: 100000
    min_type_cells: 50
    n_pcs: 50
    seed: 0
    dedup_cells: true
    device: cpu

  # Cell level: retention (validation F1 >= 0.40 at tau 0.15, concepts with 5-100 panel genes),
  # projection to cells, GSI excess / MHR@100 on every stored cell (n_cells above the dataset size
  # reads all shards; the manuscript run read 75,745 cells), populations >= 30 cells, 5 label
  # shuffles, seed 0.
  cells:
    retain: {tau: 0.15, min_valid_f1: 0.40, concept_size: [5, 100], min_features: 10, unit: row}
    projection: {dedup_cells: true, batch_size: 8192}
    specificity: {min_pop: 30, n_shuffles: 5, mhr_k: 100, n_leading: 3, n_assoc: 50, n_null: 50, n_cells: 100000,
                  representations: [sae, raw, genes], exclude_qc_flagged: false, seed: 0}
    device: cpu

  # Niches: radii 100 / 120 / 150 CosMx pixels = 18 / 21.6 / 27 um (0.18 um per pixel), k 3-5,
  # k-means and full-covariance GMM, neighbourhood mean (m) or cell + neighbourhood (xm), seeds 0-2,
  # clusters of at least 150 cells, PCA 50, tile-shuffle null with 10 draws over 4 x radius tiles;
  # score 1.5 ARI_seed + 0.1 clip(z, 10) + separability. Baselines: 50 truncated-SVD components of
  # log-normalized expression through the same sweep and at the selected configuration; label
  # composition at the manuscript's 120 px / k = 3 (PCA 15, k-means with 20 initialisations) and at
  # the selected configuration. Concept labels: top 25 by effect per niche.
  niches:
    radii_um: [18.0, 21.6, 27.0]
    k: [3, 4, 5]
    methods: [kmeans, gmm]
    spaces: [m, xm]
    seeds: [0, 1, 2]
    min_cluster: 150
    n_pcs: 50
    kernel: uniform
    tile_mult: 4.0
    n_null: 10
    null_seed: 0
    score: {ari: 1.5, purity_z: 0.1, sep: 1.0, purity_z_clip: 10.0}
    baselines: [expression_svd50, label_composition]
    expression: {n_components: 50, seed: 0}
    label_composition: {radius_um: 21.6, k: 3, n_pcs: 15, n_init: 20, seed: 0}
    expression_variants: {enabled: false, seeds: [0, 1, 2]}
    seed_stability: {k: [4, 5]}
    concepts: {top_k: 25, active_threshold: 0.0, min_cells: 20, rank_by: effect}
    fixed_configs: [{radius_um: 18.0, space: m, method: kmeans, k: 3}]   # the manuscript's selected configuration, validated whatever the sweep picks

  # Interfaces: the manuscript's strict crosstalk test on the author labels grouped as in the paper
  # (dataset.labels.groups): edge radius and stratum block 120 px = 21.6 um (the block is kept at the paper's
  # value although it holds few cells per stratum), legacy tile 400 px = 72 um, smooth-field length scales
  # 60 / 150 / 400 px; 100 permutations, calibration 50 permutations x 2 fields per scale, legacy 20;
  # covariates: log counts, log genes, log bounding-box area (Width x Height); niches of the manuscript's
  # configuration. Fired-on genes from the first 4 store shards (the manuscript's row budget for this model).
  interfaces:
    edge_radius_um: 21.6
    block_um: 21.6
    legacy_tile_um: 72.0
    length_scales_um: [10.8, 27.0, 72.0]
    n_perm: 100
    calib_perm: 50
    calib_reps: 2
    legacy_perm: 20
    min_edges: 50
    clip_quantile: 0.995
    exclude_groups: [low_quality, unresolved]
    covariates: {area: {product: [Width, Height]}}
    niche: {config: "r18um/m/kmeans/k3"}
    markers: {enabled: true, top_n: 10}
    fired_on: {enabled: true, max_shards: 4, threshold: 0.15, rate: 0.2, mass: 0.8}

  # Ligand–receptor co-localization screen (model-free: counts, coordinates and author labels only): CellChatDB human
  # pairs with every gene on the panel (complexes resolved), radius 100 px = 18 um, positivity >= 1 (primary) and >= 3
  # transcripts, >= 100 positive cells per side, within-type null with 100 permutations (seed 7), BH per threshold,
  # hit = q < 0.05 and fold >= 1.2. `match_neighbors_to: 286.67` (the Xenium section's mean count at 100 um) instead of
  # radius_um gives the matched radius 652.8 px = 117.5 um (grid 0.5 px, rounded to 0.1 px); placement of the hits on
  # the manuscript's niche configuration.
  lr_screen:
    radius_um: 18.0
    thresholds: [1, 3]
    n_perm: 100
    seed: 7
    min_positive: 100
    q_max: 0.05
    fold_min: 1.2
    match_grid_step: 0.5                                  # native units (px), used only with match_neighbors_to
    match_round_decimals: 1
    niche: {config: "r18um/m/kmeans/k3"}

output:
  html: true
  json: true
  keep_store: true
