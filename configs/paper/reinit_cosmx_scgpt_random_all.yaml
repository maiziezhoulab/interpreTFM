# Randomly re-initialized models (Methods; Supplementary Table S1, note): CosMx lung-cancer section, scGPT
# with every parameter re-initialized (seed 0), stored layer `layer_1.norm2` (display "Layer 2"), on the 30,356 cells
# of the GSI/MHR sample (the same cells as reinit_cosmx_scgpt_trained.yaml).
# Sparse SAEs of the five lambda values (8x width, 4096 features), the fixed selection rule and the
# held-out concept F1 (row and whole-gene split, sparse SAE features) as for the six representative layers.
#
# The run starts from the cached store of this extraction and the cached checkpoints of the five SAEs, so it
# needs no model and no GPU:
#   interpretfm run configs/paper/reinit_cosmx_scgpt_random_all.yaml --env-file configs/paper/paths.env --stages ingest,extract,sae,concepts,concept_eval
# Without stages.extract.store_root, the extract stage loads the model in its environment, re-initializes it
# on the GPU (the draws come from the GPU's generator; a CPU gives other weights) and extracts the listed cells
# (tests/reproduction/test_controls.py compares 40 re-extracted cells with the cached store).

run:
  name: reinit_cosmx_scgpt_random_all
  out_dir: ${INTERPRETFM_RUNS}/reinit_cosmx_scgpt_random_all
  seed: 0

dataset:
  h5ad: ${INTERPRETFM_DATA}/cosmx_human_lung_sec8.h5ad   # 81,236 cells x 960 genes, X = raw counts
  counts_layer: null
  gene_id: {column: index, kind: ensembl}                 # var_names are Ensembl ids; symbols in var["feature_name"]
  labels: {column: author_cell_type, groups: cosmx_author_groups.csv}
  spatial: {obsm: spatial, um_per_unit: 0.18}
  qc: {min_transcripts: 0, min_genes: 0}

model:
  name: scgpt
  checkpoint: ${INTERPRETFM_MODELS}/scGPT/whole-human-pretrain
  env: {conda: "${INTERPRETFM_SCGPT_ENV}"}                 # used only for a fresh extraction (no store_root)
  layers: [layer_1.norm2]
  cell_pooling: {kind: token, token: "60695"}             # scGPT <cls> token id
  special_tokens: ["60694", "60695"]                      # <pad>, <cls>
  representative_layer: layer_1.norm2

stages:
  # The cached store of this extraction: the weights and cells below, 8 cells per batch, at most 512 tokens per
  # cell, float32 rows (the extraction settings of the manuscript's store).
  extract:
    store_root: ${INTERPRETFM_REINIT_CACHE}/stores/scgpt/rand_all
    weights: random_all
    weights_seed: 0
    cell_subset: cosmx_scgpt_sample_cells.txt.gz
    batch_size: 8
    max_length: 512
    dtype: float32
    device: cuda
    gene_keys: {symbol_column: feature_name}

  # The lambda grid {0.1, 0.3, 1, 3, 10} with the fixed rule (L0 <= 2 % of features per token, dead-feature rate
  # <= 0.25, then lowest FVU), applied to the cached checkpoints of the five SAEs (v2biased recipe: 8000 steps,
  # lr 1e-4, 1000 warm-up steps, resampling every 2000 steps, batch 1024, seed 0).
  sae:
    width_multiplier: 8
    lambda: {grid: [0.1, 0.3, 1.0, 3.0, 10.0], rule: {l0_max: 0.02, dead_max: 0.25}}
    steps: 8000
    lr: 1.0e-4
    warmup: 1000
    resample_every: 2000
    batch_size: 1024
    seed: 0
    device: cpu
    exclude_special_tokens: false
    untrained_baseline: false
    qc: {max_shards: 300, rows_per_shard: 512}
    checkpoints:
      layer_1.norm2:
        "0.1": ${INTERPRETFM_REINIT_CACHE}/runs/scgpt__rand_all/scgpt/layer_1_norm2/sae/v2biased__steps_8000__lam_0p1/sae_layer_1.norm2_best.pt
        "0.3": ${INTERPRETFM_REINIT_CACHE}/runs/scgpt__rand_all/scgpt/layer_1_norm2/sae/v2biased__steps_8000__lam_0p3/sae_layer_1.norm2_best.pt
        "1.0": ${INTERPRETFM_REINIT_CACHE}/runs/scgpt__rand_all/scgpt/layer_1_norm2/sae/v2biased__steps_8000__lam_1/sae_layer_1.norm2_best.pt
        "3.0": ${INTERPRETFM_REINIT_CACHE}/runs/scgpt__rand_all/scgpt/layer_1_norm2/sae/v2biased__steps_8000__lam_3/sae_layer_1.norm2_best.pt
        "10.0": ${INTERPRETFM_REINIT_CACHE}/runs/scgpt__rand_all/scgpt/layer_1_norm2/sae/v2biased__steps_8000__lam_10/sae_layer_1.norm2_best.pt

  concepts:
    sources: [GO:BP, GO:MF, GO:CC, REAC, KEGG]
    fdr: 0.05
    min_overlap: 2
    organism: hsapiens
    query_key: ensembl
    gene_keys: {symbol_column: feature_name}
    offline_matrix: ${INTERPRETFM_PAPER_CACHE}/f1heldout_gene_token_row_cosmx_all_layers_l1_1e-3/gprofiler/gprofiler_binary_gene_by_term.csv
    offline_terms: ${INTERPRETFM_PAPER_CACHE}/f1heldout_gene_token_row_cosmx_all_layers_l1_1e-3/gprofiler/gprofiler_terms.tsv

  # Held-out concept alignment of the selected sparse SAE: row split and whole-gene split, thresholds
  # 0 / 0.15 / 0.3 / 0.6, concept F1 at tau 0.15 over concepts with 5-100 panel genes.
  concept_eval:
    thresholds: [0.0, 0.15, 0.3, 0.6]
    split: {valid: 0.2, test: 0.1}
    units: [row, gene]
    representations: [sae]
    summary: {tau: 0.15, concept_size: [5, 100]}
    dedup_cells: auto
    seed: 0
    top_m: 200
    batch_size: 8192
    device: cpu
    n_jobs: 2              # the two evaluations in separate processes (wall time only; not part of the stage hash)
    token_vocab: ${INTERPRETFM_MODELS}/scGPT/whole-human-pretrain/vocab.json

output:
  html: false
  json: true
  keep_store: true
