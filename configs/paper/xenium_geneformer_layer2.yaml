# Manuscript configuration: Xenium renal-cell-carcinoma section, Geneformer (V2), stored layer `layer_1`
# (display "Layer 2"). Every parameter is the one used for the manuscript (Methods and
# Supplementary Table S1); the run starts from the cached activation store and the cached
# SAE checkpoint, so no model and no GPU are needed. See configs/paper/cosmx_scgpt_layer2.yaml
# for the commented reference configuration and docs/reproducing.md for the data layout.
#   interpretfm run configs/paper/xenium_geneformer_layer2.yaml --env-file configs/paper/paths.env

run:
  name: xenium_geneformer_layer2
  out_dir: ${INTERPRETFM_RUNS}/xenium_geneformer_layer2
  seed: 0

dataset:
  h5ad: ${INTERPRETFM_DATA}/xenium_rcc_union_filtered_nonzero.h5ad   # 465,220 cells x 399 model-compatible genes, X = raw counts
  counts_layer: null
  gene_id: {column: index, kind: symbol}                 # var_names are gene symbols; Ensembl ids in var["gene_ids"]
  labels: {column: cell_type}
  spatial: {obsm: spatial, um_per_unit: 1.0}             # Xenium coordinates are already in um
  qc: {min_transcripts: 0, min_genes: 0}                  # no cell filtering in the manuscript

model:
  name: geneformer
  checkpoint: null                                              # weights are not needed: the store is cached
  env: {}                                                 # not used: the activation store is cached
  layers: [layer_1]
  cell_pooling: {kind: token, token: "<cls>"}             # Geneformer <cls> token
  special_tokens: ["<cls>", "<eos>"]                      # stored token ids are Ensembl ids, so no vocabulary is needed
  representative_layer: layer_1

stages:
  # Cached activation store written by the manuscript's extraction (60 shards; every cell was stored twice, removed by dedup_cells).
  extract: {store_root: "${INTERPRETFM_STORES}/acts_extraction_geneformer_xenium"}

  tis: {trials: 800, k_ref: 32, quantiles: [0.25, 0.75], judge: log1p_cp10k,
        controls: [shuffle, pca], pca_of: activations, seed: 42, keep_cell_matrix: true}

  # 8x width (9216 features); lambda = 1 by the fixed rule over {0.1, 0.3, 1, 3, 10} (only the selected
  # checkpoint is cached; the reproduction test applies the rule to the cached QC of all five).
  sae:
    width_multiplier: 8
    lambda: {grid: [1.0], rule: {l0_max: 0.02, dead_max: 0.25}}
    steps: 8000
    lr: 1.0e-4
    warmup: 1000
    resample_every: 2000
    batch_size: 1024
    seed: 0
    device: cpu
    exclude_special_tokens: false
    untrained_baseline: true
    qc: {max_shards: 300, rows_per_shard: 512}
    checkpoints:
      layer_1:
        "1.0": ${INTERPRETFM_PAPER_CACHE}/sae_v2/xenium/geneformer/layer_1/sae/v2biased__steps_8000__lam_1/sae_layer_1_best.pt

  # The g:Profiler universe of the panel used for the manuscript (the manuscript's concepts), from the cache.
  concepts:
    sources: [GO:BP, GO:MF, GO:CC, REAC, KEGG]
    fdr: 0.05
    min_overlap: 2
    organism: hsapiens
    query_key: symbol
    gene_keys: {ensembl_column: gene_ids}
    offline_matrix: ${INTERPRETFM_PAPER_CACHE}/xenium_geneformer_c2sscale_strict_from_extract_to_immune/01_f1_heldout/gprofiler/gprofiler_binary_gene_by_term.csv
    offline_terms: ${INTERPRETFM_PAPER_CACHE}/xenium_geneformer_c2sscale_strict_from_extract_to_immune/01_f1_heldout/gprofiler/gprofiler_terms.tsv

  concept_eval:
    thresholds: [0.0, 0.15, 0.3, 0.6]
    split: {valid: 0.2, test: 0.1}
    units: [row, gene]
    representations: [sae, raw, untrained]
    summary: {tau: 0.15, concept_size: [5, 100]}
    dedup_cells: auto
    seed: 0
    top_m: 200
    batch_size: 8192
    device: cpu

  gene_readout:
    n_splits: 5
    C: 1.0
    scaling: [standardize, center]
    controls: [random, coexpression, coexpression_pc50, celltype, trivial]
    concept_size: [5, 100]
    split: {valid: 0.2, test: 0.1}
    max_cells: 100000
    min_type_cells: 50
    n_pcs: 50
    seed: 0
    dedup_cells: true
    device: cpu

output:
  html: true
  json: true
  keep_store: true
