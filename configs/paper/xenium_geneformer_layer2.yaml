# Manuscript configuration: Xenium renal-cell-carcinoma section, Geneformer (V2), stored layer `layer_1`
# (display "Layer 2"). Every parameter is the one used for the manuscript (Methods and
# Supplementary Table S1); the run starts from the cached activation store and the cached
# SAE checkpoint, so no model and no GPU are needed. See configs/paper/cosmx_scgpt_layer2.yaml
# for the commented reference configuration and docs/reproducing.md for the data layout.
#   interpretfm run configs/paper/xenium_geneformer_layer2.yaml --env-file configs/paper/paths.env

run:
  name: xenium_geneformer_layer2
  out_dir: ${INTERPRETFM_RUNS}/xenium_geneformer_layer2
  seed: 0

dataset:
  h5ad: ${INTERPRETFM_DATA}/xenium_rcc_union_filtered_nonzero.h5ad   # 465,220 cells x 399 model-compatible genes, X = raw counts
  counts_layer: null
  gene_id: {column: index, kind: symbol}                 # var_names are gene symbols; Ensembl ids in var["gene_ids"]
  labels: {column: cell_type}
  spatial: {obsm: spatial, um_per_unit: 1.0}             # Xenium coordinates are already in um
  qc: {min_transcripts: 0, min_genes: 0}                  # no cell filtering in the manuscript

model:
  name: geneformer
  checkpoint: null                                              # weights are not needed: the store is cached
  env: {}                                                 # not used: the activation store is cached
  layers: [layer_1]
  cell_pooling: {kind: token, token: "<cls>"}             # Geneformer <cls> token
  special_tokens: ["<cls>", "<eos>"]                      # stored token ids are Ensembl ids, so no vocabulary is needed
  representative_layer: layer_1

stages:
  # Cached activation store written by the manuscript's extraction (60 shards; every cell was stored twice, removed by dedup_cells).
  extract: {store_root: "${INTERPRETFM_STORES}/acts_extraction_geneformer_xenium"}

  tis: {trials: 800, k_ref: 32, quantiles: [0.25, 0.75], judge: log1p_cp10k,
        controls: [shuffle, pca], pca_of: activations, seed: 42, keep_cell_matrix: true}

  # 8x width (9216 features); lambda = 1 by the fixed rule over {0.1, 0.3, 1, 3, 10} (only the selected
  # checkpoint is cached; the reproduction test applies the rule to the cached QC of all five).
  sae:
    width_multiplier: 8
    lambda: {grid: [1.0], rule: {l0_max: 0.02, dead_max: 0.25}}
    steps: 8000
    lr: 1.0e-4
    warmup: 1000
    resample_every: 2000
    batch_size: 1024
    seed: 0
    device: cpu
    exclude_special_tokens: false
    untrained_baseline: true
    qc: {max_shards: 300, rows_per_shard: 512}
    checkpoints:
      layer_1:
        "1.0": ${INTERPRETFM_PAPER_CACHE}/sae_v2/xenium/geneformer/layer_1/sae/v2biased__steps_8000__lam_1/sae_layer_1_best.pt

  # The g:Profiler universe of the panel used for the manuscript (the manuscript's concepts), from the cache.
  concepts:
    sources: [GO:BP, GO:MF, GO:CC, REAC, KEGG]
    fdr: 0.05
    min_overlap: 2
    organism: hsapiens
    query_key: symbol
    gene_keys: {ensembl_column: gene_ids}
    offline_matrix: ${INTERPRETFM_PAPER_CACHE}/xenium_geneformer_c2sscale_strict_from_extract_to_immune/01_f1_heldout/gprofiler/gprofiler_binary_gene_by_term.csv
    offline_terms: ${INTERPRETFM_PAPER_CACHE}/xenium_geneformer_c2sscale_strict_from_extract_to_immune/01_f1_heldout/gprofiler/gprofiler_terms.tsv

  concept_eval:
    thresholds: [0.0, 0.15, 0.3, 0.6]
    split: {valid: 0.2, test: 0.1}
    units: [row, gene]
    representations: [sae, raw, untrained]
    summary: {tau: 0.15, concept_size: [5, 100]}
    dedup_cells: auto
    seed: 0
    top_m: 200
    batch_size: 8192
    device: cpu
    n_jobs: 6              # the six evaluations in separate processes (wall time only; not part of the stage hash)

  gene_readout:
    n_splits: 5
    C: 1.0
    scaling: [standardize, center]
    controls: [random, coexpression, coexpression_pc50, celltype, trivial]
    concept_size: [5, 100]
    split: {valid: 0.2, test: 0.1}
    max_cells: 100000
    min_type_cells: 50
    n_pcs: 50
    seed: 0
    dedup_cells: true
    device: cpu

  # Cell level: retention (validation F1 >= 0.40 at tau 0.15, concepts with 5-100 panel genes),
  # projection to cells, GSI excess / MHR@100 on a sample of stored cells, populations >= 30 cells, 5 label
  # shuffles, seed 0. The manuscript's Xenium evaluation read the evenly spaced shards holding about
  # 100,000 cells (TACCO cell_type populations).
  cells:
    retain: {tau: 0.15, min_valid_f1: 0.40, concept_size: [5, 100], min_features: 10, unit: row}
    projection: {dedup_cells: true, batch_size: 8192}
    specificity: {min_pop: 30, n_shuffles: 5, mhr_k: 100, n_leading: 3, n_assoc: 50, n_null: 50, n_cells: 100000,
                  representations: [sae, raw, genes], exclude_qc_flagged: false, seed: 0}
    device: cpu

  # Niches: radii 100 / 120 / 150 um (Xenium coordinates are in um), otherwise the CosMx grid and
  # score; label composition at the manuscript's 100 um / k = 5.
  niches:
    # The manuscript compares the Xenium niches with the marker-derived labels (per-cell CSV, 14 labels incl.
    # low_quality); the dataset's cell_type column (TACCO) stays the label set of the cell-level stages.
    labels: {column: marker_label, file: "${INTERPRETFM_DATA}/xenium_marker_labels.csv.gz", file_column: label}
    radii_um: [100.0, 120.0, 150.0]
    k: [3, 4, 5]
    methods: [kmeans, gmm]
    spaces: [m, xm]
    seeds: [0, 1, 2]
    min_cluster: 150
    n_pcs: 50
    kernel: uniform
    tile_mult: 4.0
    n_null: 10
    null_seed: 0
    score: {ari: 1.5, purity_z: 0.1, sep: 1.0, purity_z_clip: 10.0}
    baselines: [expression_svd50, label_composition]
    expression: {n_components: 50, seed: 0}
    label_composition: {radius_um: 100.0, k: 5, n_pcs: 15, n_init: 20, seed: 0}   # the manuscript's baseline at five niches
    expression_variants: {enabled: false, seeds: [0, 1, 2]}
    seed_stability: {k: [4, 5]}
    concepts: {top_k: 25, active_threshold: 0.0, min_cells: 20, rank_by: effect}
    # The manuscript's Xenium niches are the five-niche partitions (readthrough P1, Supplementary Note S1): the k = 5
    # configuration of this model, validated whatever the sweep picks; the earlier three-niche configuration follows.
    fixed_configs: [{radius_um: 120.0, space: m, method: kmeans, k: 5}, {radius_um: 150.0, space: m, method: gmm, k: 3}]

  # Interfaces: the manuscript tested the marker-derived labels (per-cell CSV; exact label = group, no group map;
  # low_quality excluded) on the five-niche partition: edge radius and stratum block 120 um, legacy tile 400 um,
  # smooth-field length scales 60 / 150 / 400 um; covariates: log counts, log genes, log cell_area. The
  # manuscript's fired-on genes read shards until 700,000 gene-token rows (2 shards of this store).
  interfaces:
    labels: {normalize: true, column: marker_label, file: "${INTERPRETFM_DATA}/xenium_marker_labels.csv.gz", file_column: label}
    edge_radius_um: 120.0
    block_um: 120.0
    legacy_tile_um: 400.0
    length_scales_um: [60.0, 150.0, 400.0]
    n_perm: 100
    calib_perm: 50
    calib_reps: 2
    legacy_perm: 20
    min_edges: 50
    clip_quantile: 0.995
    exclude_groups: [low_quality, unresolved]
    covariates: {area: {column: cell_area}}
    niche: {config: "r120um/m/kmeans/k5"}
    markers: {enabled: true, top_n: 10}
    fired_on: {enabled: true, max_shards: 2, threshold: 0.15, rate: 0.2, mass: 0.8}

  # Ligand–receptor co-localization screen (model-free): the manuscript's parameters for Xenium, radius 100 um, seed 11,
  # grid 0.1 um for a matched radius (`match_neighbors_to: 7.20`, the CosMx section's count at 100 px, gives 15.4 um).
  # The manuscript's Xenium screen permuted within the marker-derived labels (the same per-cell CSV as above).
  lr_screen:
    labels: {column: marker_label, file: "${INTERPRETFM_DATA}/xenium_marker_labels.csv.gz", file_column: label}
    radius_um: 100.0
    thresholds: [1, 3]
    n_perm: 100
    seed: 11
    min_positive: 100
    q_max: 0.05
    fold_min: 1.2
    match_grid_step: 0.1
    match_round_decimals: 1
    niche: {config: "r120um/m/kmeans/k5"}

output:
  html: true
  json: true
  keep_store: true
