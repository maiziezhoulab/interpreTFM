# Toy configuration for the v1 pipeline (in development). Paths are relative to this file.
# Generate the dataset first, from Python:
#   from interpretfm.testing import make_toy_adata; make_toy_adata().write_h5ad("data/toy.h5ad")
# (`interpretfm.testing.write_toy_run(root, store=True)` writes dataset, a synthetic activation store,
# an offline concept table and a ready-to-run configuration in one go.)
# then: interpretfm validate configs/toy.yaml ; interpretfm run configs/toy.yaml --dry-run
run:
  name: toy
  out_dir: ../runs/toy
  seed: 0

dataset:
  h5ad: ../data/toy.h5ad
  counts_layer: null              # X holds raw counts
  gene_id: {column: index, kind: symbol}
  labels: {column: cell_type}
  spatial: {obsm: spatial, um_per_unit: 0.5}   # omit this block for scRNA-seq data
  qc: {min_transcripts: 10, min_genes: 5}

model:
  name: scgpt
  checkpoint: null                # path to the model weights
  env: {}                         # {conda: interpretfm} | {prefix: /path/env} | {python: /path/bin/python}
  layers: [layer_1.norm2]
  cell_pooling: {kind: token, token: "60695"}
  special_tokens: ["60694", "60695"]
  representative_layer: layer_1.norm2
  # vocab: /path/to/vocab.json   # the model's gene vocabulary, for coverage at ingest

stages:
  extract: {batch_size: 16, rows_per_shard: 1024}   # add store_root: <path> to use an existing activation store
  tis: {trials: 40, k_ref: 8}
  sae: {width_multiplier: 2, lambda: {grid: [1.0, 3.0], rule: {l0_max: 0.3, dead_max: 0.25}}, steps: 300,
        lr: 1.0e-2, warmup: 5, resample_every: 100, batch_size: 64, device: cpu,
        qc: {max_shards: 4, rows_per_shard: 256}}
  concepts: {}                    # online g:Profiler; or offline_matrix: <gene x concept CSV>
  concept_eval: {top_m: 20, batch_size: 1024}
  gene_readout: {n_splits: 2}
  cells: {retain: {min_features: 3}, specificity: {mhr_k: 10, n_assoc: 10, n_null: 5}}   # the toy panel has 50 genes
  niches: {radii_um: [12.0, 25.0], k: [2, 3], methods: [kmeans], seeds: [0, 1], min_cluster: 5, n_pcs: 8, n_null: 3,
           label_composition: {radius_um: 12.0, k: 2, n_init: 3}, seed_stability: {k: [3]}, concepts: {top_k: 3, min_cells: 5},
           fixed_configs: [{radius_um: 12.0, space: m, method: kmeans, k: 2}]}

output:
  html: true
  json: true
